apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelab-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubelab.json: |
    {
      "title": "KubeLab Grupo 2 - GitOps",
      "tags": ["kubelab"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 0,
      "refresh": "5s",
      "panels": [
        {
          "type": "stat",
          "title": "Servicios Activos (UP)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(up)",
              "refId": "A"
            }
          ]
        }
      ]
    }