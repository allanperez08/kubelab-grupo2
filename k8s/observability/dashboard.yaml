# OBS-04: dashboard versionado que muestra CPU, memoria, replicas activas, solicitudes por
# segundo de la API y un panel de logs. Grafana lo carga solo (sidecar) por la etiqueta
# grafana_dashboard. Los datasources Prometheus y Loki se eligen con variables del dashboard.
# Origen de las metricas: http_* del endpoint /metrics de la API (via api-servicemonitor.yaml);
# CPU y memoria de cAdvisor (kubelet); replicas y estado de pods de kube-state-metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelab-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  # El nombre del archivo es nuevo a proposito: Grafana (con persistencia) recuerda por nombre de
  # archivo el dashboard provisionado anterior, que tenia otro uid, y rechazaba la actualizacion
  # ("failed to save dashboard ... uid:kubelab-grupo2: Dashboard not found").
  kubelab-plataforma.json: |
    {
      "uid": "kubelab-grupo2",
      "title": "KubeLab Grupo 2 - Plataforma",
      "tags": [
        "kubelab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "ds_prom",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "current": {},
            "regex": ""
          },
          {
            "name": "ds_loki",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "refresh": 1,
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "current": {},
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Réplicas API disponibles",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"api\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          },
          "description": "Mínimo requerido: 2 (HA-01)."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Réplicas Web disponibles",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"web\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          },
          "description": "Mínimo requerido: 2 (HA-01)."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "PostgreSQL listo",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "max(kube_pod_status_ready{namespace=\"default\", pod=\"postgres-0\", condition=\"true\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "NO",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "SÍ",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          },
          "description": "Readiness del pod postgres-0 (StatefulSet)."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pods de la API scrapeados",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum(up{job=\"api\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          },
          "description": "Targets del ServiceMonitor 'api' en estado UP. Si marca 'sin datos', Prometheus no está leyendo /metrics."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Peticiones/s a la API",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum(rate(http_requests_total{job=\"api\"}[1m])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          },
          "description": "Tráfico de usuarios; no incluye /health ni /metrics."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Targets de Prometheus UP",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum(up)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          },
          "description": "Total de targets en estado UP en todo el clúster."
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU por pod (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\", pod=~\"(api|web|postgres)-.*\", container!=\"\", container!=\"POD\"}[2m]))",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "sin datos",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Uso de CPU de api, web y postgres (namespace default)."
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memoria por pod",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\", pod=~\"(api|web|postgres)-.*\", container!=\"\", container!=\"POD\"})",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "sin datos",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Memoria (working set) de api, web y postgres."
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Peticiones por segundo a la API (por código HTTP)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum by (status_code) (rate(http_requests_total{job=\"api\"}[1m]))",
              "refId": "A",
              "legendFormat": "HTTP {{status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "sin datos",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Latencia p95 de la API",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api\"}[2m])))",
              "refId": "A",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "sin datos",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Logs (api, web y postgres)",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "{namespace=\"default\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "prettifyLogMessage": false
          }
        }
      ]
    }
