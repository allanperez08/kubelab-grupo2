apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-configs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/allanperez08/kubelab-grupo2.git'
    targetRevision: main
    path: k8s/observability
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true