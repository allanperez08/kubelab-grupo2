name: API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**' # CD-01: Filtrado por ruta

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # CD-01: se ejecutan las pruebas de la API antes de construir la imagen.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run API tests
        working-directory: apps/api
        run: |
          npm install
          npm test

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Get Short SHA
        id: vars
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/api
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/kubelab-api:${{ env.SHA_SHORT }}

      - name: Update K8s Manifest and Push (GitOps)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          # SEC-03: Obteniendo credencial desde Doppler CLI
          GIT_PAT=$(doppler secrets get GIT_PAT --plain)
          
          # Actualizando el YAML con el nuevo hash (GitOps Flow)
          sed -i "s|image: .*kubelab-api:.*|image: ghcr.io/${OWNER_LC}/kubelab-api:${SHA_SHORT}|g" k8s/apps/api.yaml
          
          # Configurando Git y haciendo commit
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GIT_PAT}@github.com/${{ github.repository }}.git
          git add k8s/apps/api.yaml
          git commit -m "ci: update API image to ${SHA_SHORT} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push